<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCode Chat</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="app"><aside class="sidebar"><div class="brand">OpenCode <span>Chat</span></div><button id="newChat" class="new-chat">+ Nuevo chat</button><div id="sessions" class="sessions"></div><div class="side-note">MVP · GitHub Pages + OpenRouter</div><div class="settings"><label for="model">Modelo</label><select id="model"><option value="openai/gpt-5.6-luna">GPT-5.6 Luna</option><option value="openai/gpt-5.6-sol">GPT-5.6 Sol</option><option value="openai/gpt-5.1-codex-max">GPT-5.1 Codex Max</option></select><div class="context">Repositorio<br><strong>sebastisnzoth/opencode</strong><br>Rama <strong>github-pages-mvp</strong></div><small>La API key permanece en el backend.</small></div></aside><section class="chat"><header><strong>OpenCode Chat</strong><span id="status">Listo</span></header><div id="messages" class="messages"><div class="welcome"><h1>¿En qué trabajamos?</h1><p>Un chat tipo ChatGPT preparado para OpenCode.</p></div></div><form id="composer"><textarea id="input" rows="1" placeholder="Escribí un mensaje..." required></textarea><button id="send" type="submit" aria-label="Enviar">↑</button></form><footer>GitHub Pages · backend seguro · OpenRouter</footer></section></main><script src="./config.js"></script><script src="./app-v2.js"></script></body></html>
