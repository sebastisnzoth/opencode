<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenCode Chat</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">OpenCode <span>Chat</span></div>
      <button id="newChat" class="new-chat">+ Nuevo chat</button>
      <div class="side-note">MVP · GitHub Pages + OpenRouter</div>
      <div class="settings">
        <label>Modelo OpenRouter</label>
        <input id="model" value="openai/gpt-4o-mini" />
        <label>API key</label>
        <input id="key" type="password" placeholder="sk-or-..." autocomplete="off" />
        <button id="saveKey">Guardar en este navegador</button>
        <small>La clave no se guarda en GitHub. Para producción, usá un backend seguro.</small>
      </div>
    </aside>
    <section class="chat">
      <header><strong>OpenCode Chat</strong><span id="status">Listo</span></header>
      <div id="messages" class="messages">
        <div class="welcome"><h1>¿En qué trabajamos?</h1><p>Un MVP estilo ChatGPT para tu OpenCode.</p></div>
      </div>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Escribí un mensaje..." required></textarea>
        <button id="send" type="submit" aria-label="Enviar">↑</button>
      </form>
      <footer>Las respuestas usan OpenRouter. Revisá costos y permisos de tu cuenta.</footer>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
